name: Build All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK
        run: gradle :composeApp:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Windows Package
        run: gradle :composeApp:packageMsi
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: composeApp/build/compose/binaries/main/msi/*.msi

  mac:
    name: Build Mac App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build macOS Package
        run: gradle :composeApp:packageDmg
      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: composeApp/build/compose/binaries/main/dmg/*.dmg

  linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Linux Package
        run: gradle :composeApp:packageDeb
      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: composeApp/build/compose/binaries/main/deb/*.deb
